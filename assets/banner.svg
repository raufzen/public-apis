<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Public APIs - A collective list of free and public APIs curated by Rauf Zen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="15%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#14b8a6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-indigo" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#334155" stroke-width="0.8" opacity="0.35"/>
    </pattern>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#glow-teal)"/>
  <rect width="1280" height="420" fill="url(#glow-indigo)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- Top bar -->
  <line x1="60" y1="50" x2="1220" y2="50" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#64748b">GITHUB.COM / RAUFZEN / PUBLIC-APIS</text>
  <text x="1220" y="38" text-anchor="end" font-family="monospace" font-size="13" font-weight="600" fill="#38bdf8">OPEN SOURCE · 2000+ APIs</text>

  <!-- Center Card -->
  <g transform="translate(60, 90)">
    <!-- Icon -->
    <g transform="translate(0, 15)">
      <rect width="90" height="90" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
      <rect x="4" y="4" width="82" height="82" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
      <text x="45" y="58" text-anchor="middle" font-family="monospace" font-size="34" font-weight="900" fill="#38bdf8">&lt;/&gt;</text>
    </g>

    <!-- Main Title -->
    <text x="120" y="65" font-family="-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5" fill="url(#title-grad)">PUBLIC APIs</text>
    <text x="120" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="500" fill="#94a3b8">The definitive collective directory of free &amp; public APIs for software developers &amp; AI agents.</text>

    <!-- Tags Row -->
    <g transform="translate(0, 155)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="150" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="75" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">⚡ REST &amp; GRAPHQL</text>

      <!-- Tag 2 -->
      <rect x="165" y="0" width="140" height="38" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="235" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#818cf8">🤖 AI &amp; MACHINE LEARNING</text>

      <!-- Tag 3 -->
      <rect x="320" y="0" width="125" height="38" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
      <text x="382" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">🔑 NO KEY NEEDED</text>

      <!-- Tag 4 -->
      <rect x="460" y="0" width="135" height="38" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="527" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#fbbf24">🌐 50+ CATEGORIES</text>

      <!-- Tag 5 -->
      <rect x="610" y="0" width="160" height="38" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/>
      <text x="690" y="24" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#f472b6">🛠️ MCP AGENT SERVERS</text>
    </g>

    <!-- Author Badge -->
    <g transform="translate(0, 220)">
      <line x1="0" y1="0" x2="1160" y2="0" stroke="#1e293b" stroke-width="1.5"/>
      <text x="0" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#64748b">CURATED &amp; MAINTAINED BY <tspan fill="#f1f5f9" font-weight="700">RAUF ZEN</tspan> (@raufzen)</text>
      <text x="1160" y="28" text-anchor="end" font-family="monospace" font-size="13" fill="#64748b">MIT LICENSE · FREE TO USE &amp; CONTRIBUTE</text>
    </g>
  </g>
</svg>